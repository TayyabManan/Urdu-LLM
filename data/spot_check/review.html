<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Urdu v3 — Data Spot-Check</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --mut: #8b93a3;
      --bd: #2a2f3a;
      --fg: #e8eaf0;
      --pass: #2ea043;
      --fail: #e5534b;
      --uns: #d9a40a;
      --accent: #4c8bf5;
      --hint: #3a3320;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      background: #12141a;
      border-bottom: 1px solid var(--bd);
      padding: 10px 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      z-index: 5;
    }

    header .sp {
      flex: 1
    }

    .counts b {
      color: var(--pass)
    }

    .counts i {
      color: var(--fail);
      font-style: normal
    }

    .counts u {
      color: var(--uns);
      text-decoration: none
    }

    button {
      background: #222734;
      color: var(--fg);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer
    }

    button:hover {
      border-color: var(--accent)
    }

    .wrap {
      max-width: 920px;
      margin: 18px auto;
      padding: 0 16px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 18px
    }

    .badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
      font-size: 12px
    }

    .b {
      padding: 3px 9px;
      border-radius: 999px;
      background: #222734;
      color: var(--mut);
      border: 1px solid var(--bd)
    }

    .b.g {
      color: #cdd6e6
    }

    .hint {
      background: var(--hint);
      border: 1px solid #5a4d22;
      color: #f0e6c0;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13.5px;
      margin: 10px 0
    }

    .lbl {
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--mut);
      margin: 14px 0 4px
    }

    .box {
      background: #0e1016;
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 12px 14px;
      white-space: pre-wrap;
      word-wrap: break-word
    }

    .ctx {
      max-height: 230px;
      overflow: auto
    }

    .urdu {
      font-family: 'Noto Nastaliq Urdu', serif;
      direction: rtl;
      text-align: right;
      line-height: 2.3;
      font-size: 1.18rem
    }

    .latin {
      font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
      direction: ltr;
      line-height: 1.65;
      font-size: .98rem
    }

    .q {
      border-left: 3px solid var(--accent);
      padding-left: 10px
    }

    .verdicts {
      display: flex;
      gap: 10px;
      margin: 16px 0 8px
    }

    .verdicts button {
      flex: 1;
      font-weight: 600
    }

    .v-pass.on {
      background: var(--pass);
      border-color: var(--pass);
      color: #fff
    }

    .v-fail.on {
      background: var(--fail);
      border-color: var(--fail);
      color: #fff
    }

    .v-uns.on {
      background: var(--uns);
      border-color: var(--uns);
      color: #1a1a1a
    }

    textarea {
      width: 100%;
      min-height: 52px;
      background: #0e1016;
      color: var(--fg);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
      resize: vertical
    }

    .nav {
      display: flex;
      justify-content: space-between;
      margin-top: 14px
    }

    .foot {
      color: var(--mut);
      font-size: 12px;
      text-align: center;
      margin: 14px auto 40px
    }

    kbd {
      background: #222734;
      border: 1px solid var(--bd);
      border-radius: 5px;
      padding: 1px 6px;
      font-size: 11px
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 13px
    }

    td,
    th {
      border: 1px solid var(--bd);
      padding: 6px 9px;
      text-align: left
    }

    .low {
      color: var(--fail);
      font-weight: 600
    }

    .ok {
      color: var(--pass)
    }

    dialog {
      background: var(--card);
      color: var(--fg);
      border: 1px solid var(--bd);
      border-radius: 12px;
      max-width: 680px;
      width: 92%
    }
  </style>
</head>

<body>
  <header>
    <strong>Urdu v3 spot-check</strong>
    <span class="b g" id="pos">–</span>
    <span class="counts" id="counts"></span>
    <span class="sp"></span>
    <button id="summaryBtn">Summary</button>
    <button id="exportBtn">⬇ Export verdicts</button>
    <button id="importBtn">⬆ Import verdicts</button>
    <button id="resumeBtn">↪ Resume</button>
    <input id="importInput" type="file" accept=".jsonl,.ndjson,.json" style="display:none">
  </header>
  <div class="wrap">
    <div class="card" id="card"></div>
    <div class="foot">
      <kbd>P</kbd> pass · <kbd>F</kbd> fail · <kbd>U</kbd> unsure · <kbd>←</kbd>/<kbd>→</kbd> prev/next ·
      <kbd>Enter</kbd> next ·
      progress auto-saves to this browser
    </div>
  </div>
  <dialog id="dlg">
    <div id="dlgBody"></div>
    <div style="text-align:right;margin-top:12px"><button
        onclick="document.getElementById('dlg').close()">Close</button></div>
  </dialog>

        const s = g[k]; const rev = s.p + s.f + s.u;
        const rate = rev ? (100 * s.p / rev) : 0; const cls = rev && rate < 80 ? 'low' : 'ok';
        rows += `<tr><td>${k}</td><td>${s.n}</td><td>${rev}</td><td class="${cls}">${rev ? rate.toFixed(0) + '%' : '–'}</td><td>${s.f}</td><td>${s.u}</td></tr>`;
      }
      document.getElementById('dlgBody').innerHTML =
        `<h3>Per-group pass rate</h3><table><tr><th>group</th><th>sampled</th><th>reviewed</th><th>pass%</th><th>fail</th><th>unsure</th></tr>${rows}</table>
     <p style="color:var(--mut);font-size:13px;margin-top:12px">Green-light rule of thumb: overall ≥90% pass and no group below 80%. Red groups → fix that generator and regenerate just that slice before training.</p>`;
      document.getElementById('dlg').showModal();
    };
    render();
  </script>
</body>

</html>
